name: ci
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly matrix (plan 16.4)

# Actions are pinned to commits (security audit 0.33); Dependabot proposes
# updates. Jobs get only read access unless they need more.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.2', tools: composer }
      - run: composer install --no-interaction --no-progress
      - name: Known vulnerabilities in dependencies
        run: composer audit --locked --no-interaction
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: php ci/check-locales.php
      - run: php ci/check-layers.php
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress -c phpstan.neon.dist

  secrets:
    # Keys, passwords and tokens must never reach the repository (security audit 0.33).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSLf -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.2', '8.3', '8.4'] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '${{ matrix.php }}', extensions: pdo_sqlite, tools: composer }
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  stan-ojs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.3', extensions: bcmath, tools: composer }
      - run: composer install --no-interaction --no-progress
      - name: OJS 3.5.0-6 source from the official image
        run: |
          docker create --name ojsref pkpofficial/ojs:3_5_0-6
          docker cp ojsref:/var/www/html "$RUNNER_TEMP/ojs"
          docker rm ojsref
      - run: OJS_ROOT="$RUNNER_TEMP/ojs" vendor/bin/phpstan analyse --no-progress --memory-limit=2G -c ci/phpstan-ojs.neon

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/package.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: package, path: dist/ }

  upgrade:
    # Install → migrate twice → upgrade with a new schema step → API smoke test,
    # in a real OJS for each database (audit З1, NFR "upgrade without shell").
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, postgres]
        ojs: ['3_5_0-6']
        include:
          - { db: mariadb, ojs: '3_5_0-5' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/integration/start-ojs.sh ${{ matrix.db }} ${{ matrix.ojs }}
      - run: ci/integration/run.sh
      - run: ci/integration/api-smoke.sh
      - run: ci/integration/isolation.sh
      - run: ci/integration/load.sh
      - run: ci/integration/themes.sh
      - run: ci/integration/program.sh
      - run: ci/integration/legacy.sh
      - run: sudo apt-get install -y -q poppler-utils >/dev/null && ci/integration/book.sh
      - run: ci/integration/review.sh
      - run: ci/integration/bids.sh
      - run: ci/integration/groups.sh
      - run: ci/integration/reports.sh
      - run: ci/integration/partners.sh
      - run: ci/integration/attendance.sh
      - run: ci/integration/checkin.sh
      - run: ci/integration/promo.sh
      - run: ci/integration/card.sh
      - run: ci/integration/a11y.sh
      - run: ci/integration/segments.sh
      - run: ci/integration/tib.sh
      - if: failure()
        run: docker logs ojs 2>&1 | tail -200

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, secrets, unit, stan-ojs, build, upgrade]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/package.sh dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
