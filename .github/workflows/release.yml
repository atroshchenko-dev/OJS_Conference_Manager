name: release
# Attaches the installable package (and its .md5) to a GitHub release:
# on publishing a release, or by hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release (for example v0.15.0.0)
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build the package
        run: bash ci/package.sh "$RUNNER_TEMP/dist"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber --repo "$GITHUB_REPOSITORY"
